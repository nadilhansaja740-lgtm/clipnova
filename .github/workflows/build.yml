name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --org com.clipnova --project-name clipnova --platforms=android build_app
      - name: Set minSdk 24
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' build_app/android/app/build.gradle*
      - name: Copy our code
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r lib build_app/lib
      - name: Build
        run: cd build_app && flutter pub get && flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNova-APK
          path: build_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
